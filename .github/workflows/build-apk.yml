name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Pegar código do repositório
      uses: actions/checkout@v4

    - name: Instalar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Instalar dependências
      run: npm install

    - name: Build do React
      run: npm run build

    - name: Instalar Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Instalar Capacitor Android
      run: npm install @capacitor/android

    - name: Adicionar plataforma Android
      run: npx cap add android

    - name: SUBSTITUIR ÍCONE PADRÃO PELO GRANEL.PNG
      run: |
        # Criar as pastas de ícones
        mkdir -p android/app/src/main/res/mipmap-hdpi
        mkdir -p android/app/src/main/res/mipmap-mdpi
        mkdir -p android/app/src/main/res/mipmap-xhdpi
        mkdir -p android/app/src/main/res/mipmap-xxhdpi
        mkdir -p android/app/src/main/res/mipmap-xxxhdpi
        
        # Copiar o ícone granel.png para TODOS os lugares que o Android usa
        cp app_icons/granel.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
        cp app_icons/granel.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
        cp app_icons/granel.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
        cp app_icons/granel.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
        cp app_icons/granel.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        
        cp app_icons/granel.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
        cp app_icons/granel.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
        cp app_icons/granel.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
        cp app_icons/granel.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
        cp app_icons/granel.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
        
        # Também copiar para drawable (fallback)
        mkdir -p android/app/src/main/res/drawable
        cp app_icons/granel.png android/app/src/main/res/drawable/ic_launcher.png
        
        echo "✅ Ícone granel.png instalado no APK"

    - name: Copiar build para Android
      run: npx cap copy android

    - name: Gerar APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Fazer upload do APK
      uses: actions/upload-artifact@v4
      with:
        name: NossoGranel-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
